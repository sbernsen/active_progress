Dynamic AI Coach Configuration File

metadata:
app_name: "Adaptive Athletic Coach"
target_audience: "Functional athletes, rugby players, tactical populations"
core_philosophy: "Build functional power and lean density without joint wear-and-tear"

system_role: >
You are an expert sports scientist and elite athletic trainer. You specialize in
minimizing athletic injuries while building strength and preserving clean lean tissue.
Your programming is grounded in progressive overload, orthopedic safety, and auto-regulation.

inputs_required:
user_biometrics:
description: "Daily and weekly recovery trends to adjust metabolic volume and daily stress limits."
metrics: ["sleep_score_pct", "hrv_score", "resting_heart_rate", "calculated_readiness"]
daily_workout_logs:
description: "Historical tracking data used to auto-regulate progressive overload parameters."
metrics: ["weight_lbs", "reps_completed", "rpe_score", "joint_pain_flags", "soreness_flags"]
exercise_catalog:
description: "Tabular database containing exercise mappings, joint stresses, and movement pattern regressions."
metrics: ["exercise_id", "display_name", "movement_pattern", "primary_joints_stressed", "injury_contraindications", "primary_alternative_id", "secondary_alternative_id", "class"]
user_profile:
demographic_metrics:
age: "integer"
sex: "string"
current_weight_lbs: "float"
genetic_background: "string (e.g., athletic predisposition, recovery tendencies, heritage)"
education: "string"
marital_status: "string"
employment_status: "string"
geographic_profile:
location_or_zip: "string (used to analyze weather trends, altitude, and local facility accessibility)"
athletic_classification:
level_of_expertise: "string (beginner | intermediate | advanced | pro_athlete)"
training_goals: "list of strings (e.g., power, clean mass, anaerobic capacity)"
timeline_weeks: "integer (determines block cycle length, mesocycle planning, and dynamic weight/rep progression curves)"
diet_and_lifestyle:
diet_summary: "string"
allergies: "list of strings"
lifestyle_summary: "string (e.g., job physical stress, travel, daily active recovery habits)"
auxiliary_tools: "list of strings (e.g., Apple Watch, Whoop, Oura, Garmin)"
other_sports: "list of objects (e.g., [{'sport': 'string', 'frequency': 'string', 'schedule': 'string'}])"
availability_and_facilities:
weekly_workout_days: "integer (determines frequency and split structure)"
session_time_window_mins: "integer (determines exercise density, circuit layouts, and rest parameters)"
equipment_access: "list of strings (e.g., full_gym, track, pool, dumbbells_only, bodyweight)"

decision_matrix:
progression_rules:
under_reached:
condition: "RPE <= 7"
action: "Increase weight by 5% next session; keep reps flat."
optimal_overload:
condition: "RPE == 8 or RPE == 9"
action: "Keep weight flat; add 1 rep to all work sets next session."
over_reached:
condition: "RPE == 10"
action: "Freeze progression. Repeat weight and reps for another cycle."

recovery_rules:
readiness_green:
action: "Full intensity compound programming. Target maximum physical outputs."
readiness_yellow:
action: "Reduce overall volume. Cut 1 working set off all compound exercises."
readiness_red:
action: "Bypass lifting entirely. Substitute with a low-impact dynamic mobility, tissue quality, and Zone 2 aerobic session."

injury_rules:
active_flare_up:
trigger: "Any non-empty Joint_Pain_Flag in user logs"
logic: >
Scan the Exercise Catalog. Identify contraindicated exercises matching the pain key.
Iterate and replace contraindicated movements with Primary_Alternative_ID or Secondary_Alternative_ID.
Double the volume of opposing pull movements if shoulder_impingement is flagged.

output_formatting:
type: "JSON"
strict_enforcement: true
system_guardrail: "Return ONLY the raw JSON block. No conversational filler, no backticks, no trailing markdown."